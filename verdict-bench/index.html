/* ============================== Utility: deterministic pseudo-random ============================== */

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================== Simulated audit engine ============================== */
// Heuristic, fully offline scorer. Not a live call to any model API —
// it estimates each criterion from lexical signals in the pasted text,
// then adds a small deterministic per-model/per-criterion jitter so
// re-running with unchanged inputs reproduces the same verdict.

const HEDGE_WORDS = ["however", "though", "while", "but", "caveat", "concern", "risk", "criticism", "mixed", "gap", "scrutiny", "flagged", "worth noting", "não", "inquiétudes", "关注"];
const NUMBER_RE = /\d/g;
const REGIONAL_WORDS = ["euro", "eu ", "brazil", "brasil", "reais", "china", "indonesia", "中国", "import", "tax", "incentive", "incitation", "impostos", "currency", "market"];

function scoreCandidate(text, criterionKey, seed) {
  const rnd = mulberry32(seed);
  const len = text.length;
  const words = text.trim().split(/\s+/).filter(Boolean);
  const wordCount = words.length;
  const lower = text.toLowerCase();

  let base = 50;
  if (criterionKey === "sentiment") {
    const positive = (lower.match(/competitive|leader|strong|favorable|value|sharp|wins|good|benefit/g) || []).length;
    const negative = (lower.match(/controvers|criticism|risk|scandal|weak|fail|gap|concern/g) || []).length;
    base = 55 + positive * 6 - negative * 4;
  } else if (criterionKey === "accuracy") {
    const numCount = (text.match(NUMBER_RE) || []).length;
    const hasSource = /reuters|sgs|audit|epa|report|study|verified/i.test(text);
    base = 45 + Math.min(numCount * 2.5, 30) + (hasSource ? 12 : 0);
  } else if (criterionKey === "nuance") {
    const hedges = HEDGE_WORDS.reduce((acc, w) => acc + (lower.includes(w) ? 1 : 0), 0);
    base = 40 + hedges * 9 + Math.min(wordCount / 12, 15);
  } else if (criterionKey === "structure") {
    const sentences = (text.match(/[.!?]/g) || []).length || 1;
    const avgLen = wordCount / sentences;
    const idealPenalty = Math.abs(avgLen - 17) * 1.4;
    base = 78 - idealPenalty + Math.min(wordCount / 20, 10);
  } else if (criterionKey === "regional") {
    const hits = REGIONAL_WORDS.reduce((acc, w) => acc + (lower.includes(w) ? 1 : 0), 0);
    base = 38 + hits * 11;
  }

  const jitter = (rnd() - 0.5) * 10;
  const score = Math.max(4, Math.min(98, Math.round(base + jitter)));
  return score;
}

function generateRationale(model, scoresByCriterion, weights) {
  const entries = CRITERIA.map((c) => ({ ...c, score: scoresByCriterion[c.key] }));
  const sorted = [...entries].sort((a, b) => b.score - a.score);
  const strongest = sorted[0];
  const weakest = sorted[sorted.length - 1];
  return {
    strongest,
    weakest,
    summary: `Strongest on ${strongest.label.toLowerCase()} (${strongest.score}), weakest on ${weakest.label.toLowerCase()} (${weakest.score}).`,
  };
}

      />
    </div>
  );
}

function Toggle({ checked, onChange, labelOn, labelOff, iconOn, iconOff }) {
  return (
    <button
      onClick={() => onChange(!checked)}
      className="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-[12px] font-semibold transition-colors"
      style={{ background: "var(--surface-2)", color: "var(--ink)", border: "1px solid var(--border)" }}
    >
      {checked ? iconOn : iconOff}
      {checked ? labelOn : labelOff}
    </button>
  );
}

/* ============================== App ============================== */

function useLocalState(key, initial) {
  const [state, setState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { window.localStorage.setItem(key, JSON.stringify(state)); } catch (e) {}
  }, [key, state]);
  return [state, setState];
}

function App() {
  const [theme, setTheme] = useLocalState("vb-theme", "system");
  const [candidates, setCandidates] = useLocalState("vb-candidates", EXAMPLE_RESPONSES.map((r, i) => ({
    id: `c${i}`, model: r.model, text: r.text,
  })));
  const [weights, setWeights] = useLocalState("vb-weights", DEFAULT_WEIGHTS);
  const [anonymize, setAnonymize] = useLocalState("vb-anon", true);
  const [results, setResults] = useState(null);
  const [runToken, setRunToken] = useState(0);
  const [view, setView] = useState("leaderboard");
  const [exportOpen, setExportOpen] = useState(false);
  const [addModel, setAddModel] = useState("");
  const [addText, setAddText] = useState("");
  const [prompt, setPrompt] = useLocalState("vb-prompt", AUDIT_PROMPT);
  const [running, setRunning] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme === "system" ? "" : theme);
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
  }, [theme]);

  const anonMap = useMemo(() => {
    const map = {};
    candidates.forEach((c, i) => { map[c.id] = `Model ${i + 1}`; });
    return map;
  }, [candidates]);

  const totalWeight = useMemo(
    () => Object.values(weights).reduce((a, b) => a + b, 0) || 1,
    [weights]
  );
  const normalizedWeights = useMemo(() => {
    const out = {};
    CRITERIA.forEach((c) => { out[c.key] = Math.round((weights[c.key] / totalWeight) * 100); });
    return out;
  }, [weights, totalWeight]);

  const handleWeightChange = useCallback((key, val) => {
    setWeights((w) => ({ ...w, [key]: val }));
  }, [setWeights]);

  const handleAddCandidate = () => {
    if (!addModel.trim() || !addText.trim()) return;
    setCandidates((cs) => [...cs, { id: `c${Date.now()}`, model: addModel.trim(), text: addText.trim() }]);
    setAddModel(""); setAddText("");
  };
  const handleRemoveCandidate = (id) => {
    setCandidates((cs) => cs.filter((c) => c.id !== id));
    setResults(null);
  };

  const runAudit = () => {
    setRunning(true);
    setTimeout(() => {
      const perModel = candidates.map((c) => {
        const scores = {};
        CRITERIA.forEach((crit) => {
          const seed = hashString(`${c.model}::${crit.key}::${c.text.slice(0, 40)}`);
          scores[crit.key] = scoreCandidate(c.text, crit.key, seed);
        });
        const weighted = CRITERIA.reduce((sum, crit) => sum + scores[crit.key] * (normalizedWeights[crit.key] / 100), 0);
        return {
          id: c.id, model: c.model, text: c.text, scores,
          weighted: Math.round(weighted * 10) / 10,
          rationale: generateRationale(c.model, scores, normalizedWeights),
        };
      });
      perModel.sort((a, b) => b.weighted - a.weighted);
      setResults({ perModel, weights: { ...normalizedWeights }, prompt, runAt: new Date().toISOString() });
      setRunning(false);
      setRunToken((t) => t + 1);
    }, 550);
  };

  const displayName = (id, model) => (anonymize ? anonMap[id] : model);

  return (
    <div className="min-h-screen" style={{ background: "var(--paper)" }}>
      <TopBar theme={theme} setTheme={setTheme} onRun={runAudit} running={running} candidateCount={candidates.length} />

      <div className="mx-auto max-w-[1400px] px-4 md:px-6 pb-16">
        <div className="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-5 pt-5">

          {/* ============ Sidebar: bench setup ============ */}
          <aside className="flex flex-col gap-5">
            <div className="card p-4">
              <SectionLabel icon={<IconFileText size={14} />}>Audit prompt</SectionLabel>
              <textarea
                value={prompt}
                onChange={(e) => setPrompt(e.target.value)}
                rows={3}
                className="mt-2 w-full rounded-md px-3 py-2 text-[13px] leading-relaxed resize-none"
                placeholder="What did you ask each model?"
              />
              <p className="mt-2 text-[11px] leading-relaxed" style={{ color: "var(--ink-soft)" }}>
                Example scenario shown below: a fictional brand, <strong>Aurora Motors</strong>, audited across regional and global assistants. <strong>Demo scoring:</strong> scores come from built-in text-signal rules, not live AI calls.
              </p>
            </div>

            <div className="card p-4">
              <div className="flex items-center justify-between">
                <SectionLabel icon={<IconScale size={14} />}>Criteria weights</SectionLabel>
                <span className="font-mono text-[11px]" style={{ color: "var(--ink-soft)" }}>sum {totalWeight}</span>
              </div>
              <div className="divide-y" style={{ borderColor: "var(--border)" }}>
                {CRITERIA.map((c) => (
                  <Slider key={c.key} criterion={c} value={weights[c.key]}
                          onChange={handleWeightChange} normalized={normalizedWeights[c.key]} />
                ))}
              </div>
              <button
                onClick={() => setWeights(DEFAULT_WEIGHTS)}
                className="mt-1 text-[12px] font-semibold"
                style={{ color: "var(--accent)" }}
              >
                Reset to default weights
              </button>
            </div>

            <div className="card p-4">
              <SectionLabel icon={<IconGrid size={14} />}>Candidates on the bench</SectionLabel>
              <ul className="mt-2 flex flex-col gap-1.5">
                {candidates.map((c, i) => (
                  <li key={c.id} className="flex items-center justify-between gap-2 rounded-md px-2.5 py-1.5"
                      style={{ background: "var(--surface-2)" }}>
                    <div className="min-w-0 flex items-center gap-2">
                      <span className="font-mono text-[11px] shrink-0" style={{ color: "var(--ink-soft)" }}>{i + 1}</span>
                      <span className="text-[13px] font-medium truncate">{c.model}</span>
                    </div>
                    <button onClick={() => handleRemoveCandidate(c.id)} aria-label={`Remove ${c.model}`}
                            className="shrink-0 opacity-60 hover:opacity-100" style={{ color: "var(--bad)" }}>
                      <IconTrash size={14} />
                    </button>
                  </li>
                ))}
                {candidates.length === 0 && (
                  <li className="text-[12px] italic py-2" style={{ color: "var(--ink-soft)" }}>No candidates yet.</li>
                )}
              </ul>

              <div className="mt-3 pt-3" style={{ borderTop: "1px solid var(--border)" }}>
                <label className="text-[11px] font-semibold uppercase tracking-[0.08em]" style={{ color: "var(--ink-soft)" }}>Model / source name</label>
                <input
                  list="model-suggestions" type="text" value={addModel} onChange={(e) => setAddModel(e.target.value)}
                  placeholder="e.g. Kimi"
                  className="mt-1 w-full rounded-md px-3 py-1.5 text-[13px]"
                />
                <datalist id="model-suggestions">
                  {MODEL_LIBRARY.map((m) => <option key={m} value={m} />)}
                </datalist>
                <label className="mt-2 block text-[11px] font-semibold uppercase tracking-[0.08em]" style={{ color: "var(--ink-soft)" }}>Pasted response</label>
                <textarea
                  value={addText} onChange={(e) => setAddText(e.target.value)}
                  rows={3} placeholder="Paste the model's raw response to the audit prompt…"
                  className="mt-1 w-full rounded-md px-3 py-2 text-[13px] leading-relaxed resize-none"
                />
                <button
                  onClick={handleAddCandidate}
                  disabled={!addModel.trim() || !addText.trim()}
                  className="mt-2 inline-flex w-full items-center justify-center gap-1.5 rounded-md py-2 text-[13px] font-semibold disabled:opacity-40"
                  style={{ background: "var(--accent)", color: "var(--accent-ink)" }}
                >
                  <IconPlus size={15} /> Add candidate
                </button>
              </div>
            </div>
          </aside>

          {/* ============ Main: results ============ */}
          <main className="flex flex-col gap-5 min-w-0">
            <ViewSwitcher view={view} setView={setView} disabled={!results} onExport={() => setExportOpen(true)} />

            {!results && (
              <EmptyState onRun={runAudit} running={running} count={candidates.length} />
            )}

            {results && view === "leaderboard" && (
              <Leaderboard results={results} anonymize={anonymize} anonMap={anonMap} runToken={runToken} />
            )}
            {results && view === "breakdown" && (
              <Breakdown results={results} anonymize={anonymize} anonMap={anonMap} />
            )}
            {results && view === "rationale" && (
              <RationaleView results={results} anonymize={anonymize} anonMap={anonMap} />
            )}
          </main>
        </div>
      </div>

      <div className="fixed bottom-4 right-4 z-30">
        <Toggle checked={anonymize} onChange={setAnonymize}
                labelOn="Blind judging on" labelOff="Names revealed"
                iconOn={<IconEyeOff size={14} />} iconOff={<IconEye size={14} />} />
      </div>

      {exportOpen && <ExportModal results={results} anonymize={anonymize} anonMap={anonMap} onClose={() => setExportOpen(false)} />}
    </div>
  );
}

/* ============================== Top bar ============================== */

function TopBar({ theme, setTheme, onRun, running, candidateCount }) {
  const cycleTheme = () => setTheme(theme === "dark" ? "light" : theme === "light" ? "system" : "dark");
  const themeIcon = theme === "dark" ? <IconMoon size={15} /> : theme === "light" ? <IconSun size={15} /> : <IconGlobe size={15} />;
  const themeLabel = theme === "dark" ? "Dark" : theme === "light" ? "Light" : "System";
  return (
    <header className="sticky top-0 z-20 backdrop-blur" style={{ background: "color-mix(in srgb, var(--paper) 88%, transparent)", borderBottom: "1px solid var(--border)" }}>
      <div className="mx-auto max-w-[1400px] px-4 md:px-6 h-16 flex items-center justify-between gap-4">
        <div className="flex items-center gap-2.5 min-w-0">
          <span className="inline-flex items-center justify-center rounded-lg w-9 h-9 shrink-0" style={{ background: "var(--accent-soft)", color: "var(--accent)" }}>
            <IconGavel size={19} />
          </span>
          <div className="min-w-0">
            <h1 className="font-display text-[19px] leading-none font-semibold truncate">Verdict Bench</h1>
            <p className="text-[11px] leading-none mt-1" style={{ color: "var(--ink-soft)" }}>Blind LLM-as-judge brand audit · demo scoring</p>
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <button onClick={cycleTheme} className="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-[12px] font-semibold"
                  style={{ background: "var(--surface-2)", border: "1px solid var(--border)" }} aria-label="Toggle theme">
            {themeIcon}<span className="hidden sm:inline">{themeLabel}</span>
          </button>
          <button
            onClick={onRun}
            disabled={running || candidateCount === 0}
            className="inline-flex items-center gap-2 rounded-full pl-3.5 pr-4 py-2 text-[13px] font-semibold shadow-sm disabled:opacity-50"
            style={{ background: "var(--accent)", color: "var(--accent-ink)" }}
          >
            {running ? <Spinner /> : <IconPlay size={14} />}
            {running ? "Deliberating…" : "Run Audit"}
          </button>
        </div>
      </div>
    </header>
  );
}

function Spinner() {
  return (
    <svg width="14" height="14" viewBox="0 0 24 24" className="animate-spin">
      <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="3" fill="none" opacity="0.25" />
      <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" strokeWidth="3" fill="none" strokeLinecap="round" />
    </svg>
  );
}

/* ============================== View switcher ============================== */

function ViewSwitcher({ view, setView, disabled, onExport }) {
  const tabs = [
    { key: "leaderboard", label: "Leaderboard", icon: <IconMedal size={14} /> },
    { key: "breakdown", label: "Score breakdown", icon: <IconGrid size={14} /> },
    { key: "rationale", label: "Rationale cards", icon: <IconList size={14} /> },
  ];
  return (
    <div className="flex items-center justify-between gap-3 flex-wrap">
      <div className="inline-flex rounded-full p-1 gap-1" style={{ background: "var(--surface-2)", border: "1px solid var(--border)" }}>
        {tabs.map((t) => (
          <button
            key={t.key}
            onClick={() => setView(t.key)}
            disabled={disabled}
            className="inline-flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-[12.5px] font-semibold transition-colors disabled:opacity-40"
            style={view === t.key ? { background: "var(--surface)", color: "var(--ink)", boxShadow: "var(--shadow)" } : { color: "var(--ink-soft)" }}
          >
            {t.icon}{t.label}
          </button>
        ))}
      </div>
      <button
        onClick={onExport}
        disabled={disabled}
        className="inline-flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-[12.5px] font-semibold disabled:opacity-40"

      >
        <IconDownload size={14} /> Export report
      </button>

}

/* ============================== Empty state ============================== */

function EmptyState({ onRun, running, count }) {
  return (
    <div className="card p-10 flex flex-col items-center text-center gap-3 rise-in">
      <span className="inline-flex items-center justify-center rounded-full w-12 h-12" style={{ background: "var(--accent-soft)", color: "var(--accent)" }}>
        <IconScale size={22} />
      </span>
      <h2 className="font-display text-[20px] font-semibold">The bench is set, awaiting a verdict</h2>
      <p className="max-w-md text-[13px] leading-relaxed" style={{ color: "var(--ink-soft)" }}>
        {count} candidate response{count === 1 ? "" : "s"} loaded against the audit prompt. Adjust the criteria
        weights on the left, then run the audit to score, rank, and anonymize each portrayal of the brand.
      </p>
      <button
        onClick={onRun}
        disabled={running || count === 0}
        className="mt-1 inline-flex items-center gap-2 rounded-full px-5 py-2.5 text-[13px] font-semibold disabled:opacity-50"
        style={{ background: "var(--accent)", color: "var(--accent-ink)" }}
      >
        {running ? <Spinner /> : <IconPlay size={15} />} {running ? "Deliberating…" : "Run Audit"}
      </button>
    </div>
  );
}

/* ============================== Leaderboard ============================== */

function Leaderboard({ results, anonymize, anonMap, runToken }) {
  const { perModel, weights } = results;
  const best = perModel[0];
  const worst = perModel[perModel.length - 1];
  const chartData = perModel.map((m) => ({
    name: anonymize ? anonMap[m.id] : m.model,
    score: m.weighted,
    id: m.id,
  }));

  return (
    <div className="flex flex-col gap-5" key={runToken}>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
        <VerdictCard kind="best" entry={best} anonymize={anonymize} anonMap={anonMap} />
        <VerdictCard kind="worst" entry={worst} anonymize={anonymize} anonMap={anonMap} />
      </div>

      <div className="card p-4 rise-in">
        <SectionLabel icon={<IconMedal size={14} />}>Weighted ranking</SectionLabel>
        <p className="text-[11px] mt-0.5 mb-3" style={{ color: "var(--ink-soft)" }}>
          Weighted by: {CRITERIA.map((c) => `${c.short} ${weights[c.key]}%`).join(" · ")}
        </p>
        <div style={{ width: "100%", height: Math.max(220, perModel.length * 46) }}>
          <ResponsiveContainer>
            <BarChart data={chartData} layout="vertical" margin={{ top: 4, right: 36, left: 8, bottom: 4 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" horizontal={false} />
              <XAxis type="number" domain={[0, 100]} tick={{ fill: "var(--ink-soft)", fontSize: 11 }} stroke="var(--border-strong)" />
              <YAxis type="category" dataKey="name" width={92} tick={{ fill: "var(--ink)", fontSize: 12, fontWeight: 600 }} stroke="var(--border-strong)" />
              <Tooltip
                cursor={{ fill: "var(--surface-2)" }}
                contentStyle={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 8, fontSize: 12, color: "var(--ink)" }}
                formatter={(v) => [`${v}`, "Weighted score"]}
              />
              <Bar dataKey="score" radius={[0, 6, 6, 0]} maxBarSize={26}>
                {chartData.map((d, i) => (
                  <Cell key={d.id} fill={i === 0 ? "var(--accent)" : i === chartData.length - 1 ? "var(--bad)" : "var(--border-strong)"} />
                ))}
                <LabelList dataKey="score" position="right" style={{ fill: "var(--ink)", fontSize: 12, fontWeight: 700 }} />
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="card overflow-hidden rise-in">
        <div className="p-4 pb-0"><SectionLabel icon={<IconList size={14} />}>Full standings</SectionLabel></div>
        <div className="overflow-x-auto mt-2">
          <table className="w-full text-[13px] border-collapse">
            <thead>
              <tr style={{ borderBottom: "1px solid var(--border)" }}>
                <th className="text-left font-semibold px-4 py-2" style={{ color: "var(--ink-soft)" }}>Rank</th>
                <th className="text-left font-semibold px-4 py-2" style={{ color: "var(--ink-soft)" }}>Candidate</th>
                {CRITERIA.map((c) => (
                  <th key={c.key} className="text-right font-semibold px-3 py-2 whitespace-nowrap" style={{ color: "var(--ink-soft)" }}>{c.short}</th>
                ))}
                <th className="text-right font-semibold px-4 py-2" style={{ color: "var(--ink-soft)" }}>Weighted</th>
              </tr>
            </thead>
            <tbody>
              {perModel.map((m, i) => (
                <tr key={m.id} style={{ borderBottom: "1px solid var(--border)" }}>
                  <td className="px-4 py-2.5 font-mono" style={{ color: "var(--ink-soft)" }}>
                    {i === 0 ? "🥇" : i === perModel.length - 1 ? "🚨" : `#${i + 1}`}
                  </td>
                  <td className="px-4 py-2.5 font-semibold">{anonymize ? anonMap[m.id] : m.model}</td>
                  {CRITERIA.map((c) => (
                    <td key={c.key} className="px-3 py-2.5 text-right font-mono tabular">{m.scores[c.key]}</td>
                  ))}
                  <td className="px-4 py-2.5 text-right font-mono font-bold tabular" style={{ color: "var(--accent)" }}>{m.weighted}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function VerdictCard({ kind, entry, anonymize, anonMap }) {
  const isBest = kind === "best";
  const name = anonymize ? anonMap[entry.id] : entry.model;
  return (
    <div className={`card p-4 rise-in ${isBest ? "stripe-good" : "stripe-bad"}`}>
      <div className="flex items-center gap-2">
        <span className="text-[20px] leading-none">{isBest ? "🥇" : "🚨"}</span>
        <span className="text-[11px] font-semibold uppercase tracking-[0.08em]" style={{ color: isBest ? "var(--good)" : "var(--bad)" }}>
          {isBest ? "Best portrayal" : "Weakest portrayal"}
        </span>
      </div>
      <div className="mt-1.5 flex items-baseline gap-2">
        <h3 className="font-display text-[19px] font-semibold">{name}</h3>
        <span className="font-mono text-[13px] font-bold tabular" style={{ color: isBest ? "var(--good)" : "var(--bad)" }}>{entry.weighted}</span>
      </div>
      <p className="mt-1.5 text-[13px] leading-relaxed" style={{ color: "var(--ink-soft)" }}>{entry.rationale.summary}</p>
      <p className="mt-2 text-[12.5px] leading-relaxed line-clamp-3" style={{ color: "var(--ink)" }}>
        “{entry.text.slice(0, 180)}{entry.text.length > 180 ? "…" : ""}”
      </p>
    </div>
  );
}

/* ============================== Breakdown (radar + per-model bars) ============================== */

function Breakdown({ results, anonymize, anonMap }) {
  const { perModel } = results;
  const radarData = CRITERIA.map((c) => {
    const row = { criterion: c.short };
    perModel.forEach((m) => { row[anonymize ? anonMap[m.id] : m.model] = m.scores[c.key]; });
    return row;
  });
  const seriesColors = ["var(--accent)", "var(--good)", "var(--bad)", "#6b7fd7", "#a06bd7", "#3fa0b0", "#c78b3f", "#8a8a4a"];
  const names = perModel.map((m) => (anonymize ? anonMap[m.id] : m.model));

  return (
    <div className="flex flex-col gap-5">
      <div className="card p-4 rise-in">
        <SectionLabel icon={<IconScale size={14} />}>Criteria profile, all candidates</SectionLabel>
        <p className="text-[11px] mt-0.5 mb-2" style={{ color: "var(--ink-soft)" }}>Unweighted 0–100 scores per criterion</p>
        <div style={{ width: "100%", height: 380 }}>
          <ResponsiveContainer>
            <RadarChart data={radarData} outerRadius="72%">
              <PolarGrid stroke="var(--border)" />
              <PolarAngleAxis dataKey="criterion" tick={{ fill: "var(--ink)", fontSize: 12, fontWeight: 600 }} />
              <PolarRadiusAxis angle={90} domain={[0, 100]} tick={{ fill: "var(--ink-soft)", fontSize: 10 }} stroke="var(--border)" />
              {names.map((n, i) => (
                <Radar key={n} name={n} dataKey={n} stroke={seriesColors[i % seriesColors.length]}
                       fill={seriesColors[i % seriesColors.length]} fillOpacity={0.08} strokeWidth={2} />
              ))}
              <Legend wrapperStyle={{ fontSize: 12, color: "var(--ink)" }} />
              <Tooltip contentStyle={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 8, fontSize: 12 }} />
            </RadarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
        {perModel.map((m) => {
          const barData = CRITERIA.map((c) => ({ criterion: c.short, score: m.scores[c.key] }));
          const name = anonymize ? anonMap[m.id] : m.model;
          return (
            <div key={m.id} className="card p-4 rise-in">
              <div className="flex items-center justify-between mb-1">
                <h3 className="font-semibold text-[14px]">{name}</h3>
                <span className="font-mono text-[13px] font-bold tabular" style={{ color: "var(--accent)" }}>{m.weighted}</span>
              </div>
              <div style={{ width: "100%", height: 190 }}>
                <ResponsiveContainer>
                  <BarChart data={barData} margin={{ top: 4, right: 8, left: -18, bottom: 0 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" vertical={false} />
                    <XAxis dataKey="criterion" tick={{ fill: "var(--ink-soft)", fontSize: 10 }} stroke="var(--border-strong)" />
                    <YAxis domain={[0, 100]} tick={{ fill: "var(--ink-soft)", fontSize: 10 }} stroke="var(--border-strong)" />
                    <Tooltip contentStyle={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 8, fontSize: 12 }} />
                    <Bar dataKey="score" radius={[5, 5, 0, 0]} maxBarSize={34}>
                      {barData.map((d, i) => (
                        <Cell key={i} fill={d.score >= 75 ? "var(--good)" : d.score >= 55 ? "var(--warn)" : "var(--bad)"} />
                      ))}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================== Rationale cards ============================== */

function RationaleView({ results, anonymize, anonMap }) {
  const { perModel } = results;
  return (
    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
      {perModel.map((m, i) => {
        const name = anonymize ? anonMap[m.id] : m.model;
        const tone = i === 0 ? "good" : i === perModel.length - 1 ? "bad" : "accent";
        return (
          <div key={m.id} className={`card p-4 rise-in stripe-${tone}`}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="font-mono text-[11px] font-bold" style={{ color: "var(--ink-soft)" }}>#{i + 1}</span>
                <h3 className="font-display text-[16px] font-semibold">{name}</h3>
              </div>
              <Pill tone={tone}>{m.weighted}</Pill>
            </div>
            <div className="mt-2 flex flex-wrap gap-1.5">
              {CRITERIA.map((c) => (
                <Pill key={c.key} tone={ScoreTone(m.scores[c.key])}>{c.short} {m.scores[c.key]}</Pill>
              ))}
            </div>
            <div className="mt-3 grid grid-cols-2 gap-2 text-[12.5px]">
              <div className="rounded-md p-2" style={{ background: "var(--good-soft)" }}>
                <div className="font-semibold" style={{ color: "var(--good)" }}>Strongest — {m.rationale.strongest.short}</div>
                <div style={{ color: "var(--ink-soft)" }}>{m.rationale.strongest.hint}</div>
              </div>
              <div className="rounded-md p-2" style={{ background: "var(--bad-soft)" }}>
                <div className="font-semibold" style={{ color: "var(--bad)" }}>Weakest — {m.rationale.weakest.short}</div>
                <div style={{ color: "var(--ink-soft)" }}>{m.rationale.weakest.hint}</div>
              </div>
            </div>
            <p className="mt-3 text-[12.5px] leading-relaxed italic" style={{ color: "var(--ink)" }}>
              “{m.text.slice(0, 220)}{m.text.length > 220 ? "…" : ""}”
            </p>
          </div>
        );
      })}
    </div>
  );
}

/* ============================== Export modal ============================== */

function buildMarkdownReport(results, anonymize, anonMap) {
  const { perModel, weights, prompt, runAt } = results;
  const lines = [];
  lines.push(`# Verdict Bench — audit report`);
  lines.push("");
  lines.push(`**Prompt:** ${prompt}`);
  lines.push(`**Run at:** ${runAt}`);
  lines.push(`**Weights:** ${CRITERIA.map((c) => `${c.label} ${weights[c.key]}%`).join(", ")}`);
  lines.push(`**Judging mode:** ${anonymize ? "Blind (anonymized)" : "Names revealed"}`);
  lines.push("");
  lines.push(`## Ranking`);
  lines.push("");
  lines.push(`| Rank | Candidate | ${CRITERIA.map((c) => c.short).join(" | ")} | Weighted |`);
  lines.push(`|---|---|${CRITERIA.map(() => "---").join("|")}|---|`);
  perModel.forEach((m, i) => {
    const name = anonymize ? anonMap[m.id] : m.model;
    lines.push(`| ${i + 1} | ${name} | ${CRITERIA.map((c) => m.scores[c.key]).join(" | ")} | ${m.weighted} |`);
  });
  lines.push("");
  lines.push(`## Rationale`);
  perModel.forEach((m, i) => {
    const name = anonymize ? anonMap[m.id] : m.model;
    lines.push("");
    lines.push(`### ${i + 1}. ${name} — ${m.weighted}`);
    lines.push(m.rationale.summary);
  });
  return lines.join("\n");
}

function ExportModal({ results, anonymize, anonMap, onClose }) {
  const [format, setFormat] = useState("markdown");
  const [copied, setCopied] = useState(false);
  const content = useMemo(() => {
    if (!results) return "";
    if (format === "json") {
      return JSON.stringify({
        prompt: results.prompt,
        runAt: results.runAt,
        weights: results.weights,
        anonymized: anonymize,
        ranking: results.perModel.map((m, i) => ({
          rank: i + 1,
          candidate: anonymize ? anonMap[m.id] : m.model,
          scores: m.scores,
          weighted: m.weighted,
          strongest: m.rationale.strongest.short,
          weakest: m.rationale.weakest.short,
        })),
      }, null, 2);
    }
    return buildMarkdownReport(results, anonymize, anonMap);
  }, [results, anonymize, anonMap, format]);

  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(content);
      setCopied(true);
      setTimeout(() => setCopied(false), 1600);
    } catch (e) {}
  };

  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4" style={{ background: "rgba(20,18,12,0.45)" }} onClick={onClose}>
      <div className="card w-full max-w-2xl max-h-[85vh] flex flex-col rise-in" style={{ boxShadow: "var(--shadow-lg)" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between p-4" style={{ borderBottom: "1px solid var(--border)" }}>
          <h3 className="font-display text-[17px] font-semibold">Export audit report</h3>
          <button onClick={onClose} aria-label="Close" style={{ color: "var(--ink-soft)" }}><IconX size={18} /></button>
        </div>
        <div className="flex items-center gap-2 px-4 pt-3">
          {["markdown", "json"].map((f) => (
            <button key={f} onClick={() => setFormat(f)}
                    className="rounded-full px-3 py-1 text-[12px] font-semibold"
                    style={format === f ? { background: "var(--accent)", color: "var(--accent-ink)" } : { background: "var(--surface-2)", color: "var(--ink-soft)" }}>
              {f === "markdown" ? "Markdown" : "JSON"}
            </button>
          ))}
          <span className="ml-auto text-[11px]" style={{ color: "var(--ink-soft)" }}>Copy the report to your clipboard</span>
        </div>
        <div className="p-4 pt-2 flex-1 overflow-hidden flex flex-col">
          <textarea readOnly value={content}
                    className="flex-1 w-full rounded-md p-3 text-[12px] font-mono leading-relaxed resize-none"
                    style={{ minHeight: 260 }} />
        </div>
        <div className="p-4 pt-0 flex justify-end">
          <button onClick={handleCopy}
                  className="inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-[13px] font-semibold"
                  style={{ background: copied ? "var(--good)" : "var(--accent)", color: "var(--accent-ink)" }}>
            {copied ? <IconCheck size={15} /> : <IconCopy size={15} />} {copied ? "Copied" : "Copy to clipboard"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================== Mount ============================== */

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
